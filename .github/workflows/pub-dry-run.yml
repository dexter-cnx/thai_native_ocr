name: Pub dry run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  publish-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Validate pub.dev package
        run: flutter pub publish --dry-run
