name: Bootstrap tessdata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-tessdata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download detector and recognition models
        shell: bash
        run: |
          set -euo pipefail

          fast_dir=android/src/main/assets/tessdata_fast
          best_dir=android/src/main/assets/tessdata_best
          mkdir -p "$fast_dir" "$best_dir"

          for lang in tha eng; do
            curl -L --fail --retry 3 \
              -o "$fast_dir/$lang.traineddata" \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/$lang.traineddata"
            curl -L --fail --retry 3 \
              -o "$best_dir/$lang.traineddata" \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/$lang.traineddata"
            test -s "$fast_dir/$lang.traineddata"
            test -s "$best_dir/$lang.traineddata"
          done

          # Remove the old single-model-set layout once the split assets exist.
          rm -rf android/src/main/assets/tessdata
      - name: Commit traineddata assets
        shell: bash
        run: |
          if git diff --quiet -- android/src/main/assets && \
             git ls-files --error-unmatch android/src/main/assets/tessdata_fast/tha.traineddata >/dev/null 2>&1 && \
             git ls-files --error-unmatch android/src/main/assets/tessdata_fast/eng.traineddata >/dev/null 2>&1 && \
             git ls-files --error-unmatch android/src/main/assets/tessdata_best/tha.traineddata >/dev/null 2>&1 && \
             git ls-files --error-unmatch android/src/main/assets/tessdata_best/eng.traineddata >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A android/src/main/assets
          git commit -m 'build: bundle fast detector and best OCR models [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
