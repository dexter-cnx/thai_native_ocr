name: thai_native_ocr
description: Hybrid native Thai OCR for Flutter using Apple Vision on iOS and Tesseract on Android.
version: 0.2.0
homepage: https://github.com/dexter-cnx/thai_native_ocr
repository: https://github.com/dexter-cnx/thai_native_ocr
issue_tracker: https://github.com/dexter-cnx/thai_native_ocr/issues

topics:
  - ocr
  - thai
  - vision
  - tesseract
  - document-scanner

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.thai_native_ocr
        pluginClass: ThaiNativeOcrPlugin
      ios:
        pluginClass: ThaiNativeOcrPlugin
